<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <title>Islamic 8-point star tessellation</title>
  <desc>Repeating Islamic geometric pattern based on the 8-point star (khatam) — used as a low-opacity surface texture for Karwan-e-Usmania.</desc>

  <defs>
    <!-- One tile of the 8-point star tessellation -->
    <pattern id="khatam" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- soft tile background (kept transparent so parent opacity controls visibility) -->
      <rect width="100" height="100" fill="none"/>

      <!-- 8-point star (two overlapping squares rotated 45°) centered at 50,50 -->
      <g stroke="#c9a84c" stroke-width="1.1" fill="none" stroke-linejoin="round">
        <!-- Square 1 -->
        <polygon points="50,14 86,50 50,86 14,50"/>
        <!-- Square 2 (45° rotated about center) -->
        <polygon points="25,25 75,25 75,75 25,75"/>
      </g>

      <!-- Inner square accent -->
      <polygon points="50,32 68,50 50,68 32,50"
               stroke="#c9a84c" stroke-width="0.9" fill="none"/>

      <!-- Center dot -->
      <circle cx="50" cy="50" r="1.6" fill="#c9a84c"/>

      <!-- Corner quarter-stars to make the pattern tessellate continuously -->
      <g stroke="#c9a84c" stroke-width="1.1" fill="none" stroke-linejoin="round">
        <!-- top-left corner star (centered at 0,0 — only the visible quadrant lives in the tile) -->
        <polygon points="0,-36 36,0 0,36 -36,0"/>
        <polygon points="-25,-25 25,-25 25,25 -25,25"/>

        <!-- top-right corner -->
        <polygon points="100,-36 136,0 100,36 64,0"/>
        <polygon points="75,-25 125,-25 125,25 75,25"/>

        <!-- bottom-left corner -->
        <polygon points="0,64 36,100 0,136 -36,100"/>
        <polygon points="-25,75 25,75 25,125 -25,125"/>

        <!-- bottom-right corner -->
        <polygon points="100,64 136,100 100,136 64,100"/>
        <polygon points="75,75 125,75 125,125 75,125"/>
      </g>

      <!-- Connecting lines between star centers (creates the lattice) -->
      <g stroke="#c9a84c" stroke-width="0.7" stroke-dasharray="2 3" opacity="0.65">
        <line x1="0"   y1="50"  x2="100" y2="50"/>
        <line x1="50"  y1="0"   x2="50"  y2="100"/>
      </g>
    </pattern>
  </defs>

  <rect width="200" height="200" fill="url(#khatam)"/>
</svg>
