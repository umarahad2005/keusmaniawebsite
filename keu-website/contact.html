<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d1b35" />

  <title>Contact &amp; Bookings | Karwan-e-Usmania</title>
  <meta name="description" content="Contact Karwan-e-Usmania for Hajj &amp; Umrah bookings. Lahore office, WhatsApp, phone &amp; email — quick response, honest advice." />
  <meta name="keywords" content="Karwan-e-Usmania contact, Hajj booking Lahore, Umrah WhatsApp Pakistan" />
  <meta property="og:title" content="Contact &amp; Bookings | Karwan-e-Usmania" />
  <meta property="og:description" content="Reach out on WhatsApp for fastest response, or visit our Lahore office." />
  <meta property="og:image" content="/og-image.jpg" />
  <link rel="canonical" href="https://keusmania.vercel.app/contact.html" />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
</head>
<body>
  <a class="visually-hidden" href="#main-content">Skip to main content</a>
  <div id="nav-mount"></div>

  <main id="main-content">
    <header class="section section--dark" data-theme="dark" style="padding-top:9rem">
      <div class="container text-center">
        <span class="eyebrow gold-text">Contact</span>
        <h1 class="section-heading__title mt-4">We are here to help — السلام علیکم</h1>
        <p class="section-heading__subtext mt-4">
          Reach out on WhatsApp for fastest response, or send us a message below.
        </p>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: var(--space-12); align-items: start">
          <div id="contact-info" class="stack"></div>
          <form id="contact-form" class="stack" novalidate>
            <div class="field">
              <label class="field__label" for="c-name">Full Name</label>
              <input class="field__input" id="c-name" name="name" type="text" required autocomplete="name" />
            </div>
            <div class="field">
              <label class="field__label" for="c-phone">Phone</label>
              <input class="field__input" id="c-phone" name="phone" type="tel" required autocomplete="tel" />
            </div>
            <div class="field">
              <label class="field__label" for="c-email">Email</label>
              <input class="field__input" id="c-email" name="email" type="email" autocomplete="email" />
            </div>
            <div class="field">
              <label class="field__label" for="c-package">Package Interest</label>
              <select class="field__select" id="c-package" name="package">
                <option value="">Select a package</option>
                <option value="economy">Economy Umrah</option>
                <option value="premium">Premium Umrah</option>
                <option value="vip">VIP Umrah</option>
                <option value="ramadan">Ramadan Umrah</option>
                <option value="hajj">Hajj 2025</option>
                <option value="family">Family Package</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="c-prefer">Preferred Contact</label>
              <select class="field__select" id="c-prefer" name="prefer">
                <option value="whatsapp">WhatsApp</option>
                <option value="call">Phone Call</option>
                <option value="email">Email</option>
              </select>
            </div>
            <div class="field">
              <label class="field__label" for="c-message">Message</label>
              <textarea class="field__textarea" id="c-message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn--primary btn--full btn--lg">Send via WhatsApp</button>
            <p class="muted" style="font-size:var(--text-xs)">Submitting will open WhatsApp with your message pre-filled.</p>
          </form>
        </div>
      </div>
    </section>

    <section class="section section--cream">
      <div class="container">
        <div id="contact-map" style="aspect-ratio:16/9;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--color-border-gold);background:var(--color-cream)"></div>
      </div>
    </section>
  </main>

  <div id="footer-mount"></div>
  <div id="whatsapp-float-mount"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
